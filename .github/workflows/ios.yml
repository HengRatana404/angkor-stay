name: Build iOS (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/ios.yml']

jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ios --release --no-codesign
      - name: Zip the app
        run: |
          cd build/ios/iphoneos
          zip -r Runner-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: angkor-stay-ios-unsigned
          path: mobile/build/ios/iphoneos/Runner-unsigned.zip
